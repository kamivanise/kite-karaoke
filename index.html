<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<title>カイト 合唱練習</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one column practice console — controls, a sky-colored pitch stage, the lyric line, then the score. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --fg:#17202c; --muted:#5d6b7c; --line:#d6dee8;
  --accent:#d8432f; --accent-ink:#ffffff; --tail:#f2b630;
  --sky-top:#bfe0f6; --sky-bot:#eaf5fc; --grid:rgba(30,60,100,.13);
  --note:#2e5f8f; --note-hit:#d8432f; --voice:#17202c; --voice-ok:#d8432f; --playhead:rgba(23,32,44,.55);
  --warn:#b26b00;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141b; --surface:#18202b; --fg:#e8eef5; --muted:#95a3b5; --line:#2b3644;
  --accent:#ef6a52; --accent-ink:#13171d; --tail:#f2c04e;
  --sky-top:#0d2238; --sky-bot:#183a59; --grid:rgba(200,225,255,.12);
  --note:#7fb4e6; --note-hit:#ff8a6e; --voice:#f3f6fa; --voice-ok:#ffb35c; --playhead:rgba(232,238,245,.6);
  --warn:#f0b04a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,6.5vw,2rem);margin:0;letter-spacing:.04em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.group{display:flex;flex-direction:column;gap:4px}
.label{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:.9rem;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rangeSel{display:flex;align-items:center;gap:6px}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:260px}
.lyric{font-family:var(--display);font-size:1.6rem;min-height:2.6rem;line-height:1.5;text-align:center;letter-spacing:.06em;color:var(--muted);word-break:break-all}
.lyric .done{color:var(--accent)} .lyric .now{color:var(--fg)}
.lyric small{font-family:var(--body);font-size:.9rem}
.lyric ruby{ruby-position:over;margin:0 .12em}
.lyric rt{font-family:var(--body);font-size:.55em;font-weight:700;letter-spacing:0;color:var(--muted)}
.lyric .done rt{color:var(--accent)} .lyric .now rt{color:var(--fg)}
.lyric .sol{font-size:.8em;margin:0 .2em}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:var(--display);font-weight:400;font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}
.chip{font-size:.8rem;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.msg{font-size:.88rem;color:var(--muted)} .msg.warn{color:var(--warn)}
.sens{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sens input{width:150px}
.meter{width:120px;height:10px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:var(--accent)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
details summary{cursor:pointer;font-weight:700}
code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:4px}
ul{margin:0;padding-left:1.2em}
footer{font-size:.8rem;color:var(--muted)}
.recs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.recs li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.recs .rd{color:var(--muted);font-variant-numeric:tabular-nums}
.recs .rp{min-width:0}
.recs .rs{font-variant-numeric:tabular-nums}
label.btn{display:inline-block}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>カイト<span>・</span>合唱練習</h1>
    <div class="sub">混声三部合唱　♩=89　変ニ長調（♭5つ）</div>
  </header>

  <div class="row">
    <div class="group"><span class="label">パート</span>
      <div class="seg" id="partSeg">
        <button type="button" data-v="S" aria-pressed="false">ソプラノ</button>
        <button type="button" data-v="A" aria-pressed="true">アルト</button>
        <button type="button" data-v="M" aria-pressed="false">男声</button>
      </div></div>
    <div class="group"><span class="label">判定</span>
      <div class="seg" id="modeSeg">
        <button type="button" data-v="easy" aria-pressed="true">やさしい</button>
        <button type="button" data-v="normal" aria-pressed="false">ふつう</button>
        <button type="button" data-v="hard" aria-pressed="false">むずかしい</button>
      </div></div>
    <div class="group"><span class="label">練習する小節</span>
      <div class="rangeSel"><select id="barFrom" aria-label="開始小節"></select><span>〜</span><select id="barTo" aria-label="終了小節"></select></div></div>
    <div class="group"><label class="label" for="guide">お手本の音</label>
      <select id="guide"><option value="1">あり</option><option value="0">なし</option></select></div>
    <div class="group"><label class="label" for="oct">オクターブ違い</label>
      <select id="oct"><option value="0">ズレ扱い</option><option value="1">OKにする</option></select></div>
  </div>

  <div class="sens">
    <label class="label" for="sens">マイク感度</label>
    <input type="range" id="sens" min="1" max="10" step="1" value="7">
    <div class="meter" aria-hidden="true"><i id="lvl"></i><b id="thr"></b></div>
    <span class="msg" id="sensMsg">黒い線を声が超えると判定します</span>
  </div>

  <div class="stage"><canvas id="cv" aria-label="音程バー"></canvas></div>
  <div class="lyric" id="lyric" aria-live="polite"></div>

  <div class="actions">
    <button class="btn primary" id="btnMic" type="button">マイクで歌う</button>
    <button class="btn" id="btnGuide" type="button">お手本だけ聴く</button>
    <button class="btn" id="btnStop" type="button" disabled>止める</button>
  </div>

  <div class="panel">
    <div class="score"><b id="scoreNum">--</b><span id="scoreLbl" class="chip">まだ歌っていません</span></div>
    <div class="msg" id="msg">「マイクで歌う」を押すと4拍のカウントのあとに始まります。お手本の音をスピーカーで鳴らすとマイクが拾ってしまうので、イヤホンを使うか「お手本の音：なし」にしてください。</div>
  </div>

  <details class="panel" id="records">
    <summary>わたしの記録 <span class="chip" id="recCount"></span></summary>
    <div class="msg">記録はこの端末のブラウザの中にだけ保存されます。ほかの人の端末やインターネット上には送られません。</div>
    <ul class="recs" id="recList"></ul>
    <div class="actions">
      <button class="btn" id="btnExport" type="button">JSONで書き出す</button>
      <label class="btn" for="recFile">JSONを読み込む</label>
      <input type="file" id="recFile" accept="application/json,.json" hidden>
      <button class="btn" id="btnClear" type="button">記録を消す</button>
    </div>
    <div class="actions" id="clearConfirm" hidden>
      <span class="msg warn">この端末の記録をすべて消します。元に戻せません。</span>
      <button class="btn primary" id="btnClearYes" type="button">消す</button>
      <button class="btn" id="btnClearNo" type="button">やめる</button>
    </div>
    <div class="msg" id="recMsg"></div>
  </details>

  <footer>個人の練習用ページです。<a href="mic-test.html">マイク動作テスト</a></footer>
</div>

const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parse(text){
  const notes=[];let beat=0;const errs=[];const meters=[{beat:0,len:4}];
  text.split("\n").forEach((line,li)=>{
    line=line.replace(/(^|\s)#.*/,"");
    for(const tok of line.split(/[\s|]+/)){
      if(!tok)continue;
      if(tok[0]==="@"){const L=parseFloat(tok.slice(1));if(L>0)meters.push({beat,len:L});else errs.push(`${li+1}行目「${tok}」の拍子`);continue}
      const [p,d,...ly]=tok.split(":");const dur=parseFloat(d);
      if(!(dur>0)){errs.push(`${li+1}行目「${tok}」の拍数`);continue}
      if(p==="r"||p==="R"){beat+=dur;continue}
      const m=/^([A-Ga-g])(b|#)?(-?\d)$/.exec(p);
      if(!m){errs.push(`${li+1}行目「${tok}」の音名`);beat+=dur;continue}
      const midi=12*(+m[3]+1)+PC[m[1].toUpperCase()]+(m[2]==="b"?-1:m[2]==="#"?1:0);
      const prev=notes[notes.length-1];
      if(prev&&prev.tie&&prev.midi===midi&&Math.abs(prev.start+prev.dur-beat)<1e-6){prev.dur+=dur;prev.tie=tok.endsWith("~");beat+=dur;continue}
      notes.push({midi,sp:m[1].toUpperCase()+(m[2]||""),start:beat,dur,lyric:ly.join(":"),frames:0,hit:0,tie:tok.endsWith("~")});beat+=dur;
    }
  });
  const bars=[];let mi=0,len=4;
  for(let b=0;b<beat-1e-6;){while(mi<meters.length&&meters[mi].beat<=b+1e-6){len=meters[mi].len;mi++}bars.push(b);b+=len}
  return {notes,total:beat,errs,bars};
}

// ---- pitch detection (YIN, on 2x downsampled audio) ----
function down2(buf){const o=new Float32Array(buf.length>>1);for(let i=0;i<o.length;i++)o[i]=(buf[2*i]+buf[2*i+1])*.5;return o}
function rmsOf(buf){let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];return Math.sqrt(r/buf.length)}
function yin(buf,sr,g){
  if(rmsOf(buf)<g)return null;
  const maxT=Math.min(Math.floor(sr/65),buf.length>>1),minT=Math.floor(sr/1100),W=buf.length-maxT;
  const d=new Float32Array(maxT+1);
  for(let t=1;t<=maxT;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x}d[t]=s}
  let run=0;const c=new Float32Array(maxT+1);c[0]=1;
  for(let t=1;t<=maxT;t++){run+=d[t];c[t]=run?d[t]*t/run:1}
  let tau=-1;
  for(let t=Math.max(2,minT);t<maxT;t++){if(c[t]<0.15){while(t+1<maxT&&c[t+1]<c[t])t++;tau=t;break}}
  if(tau<0)return null;
  const a=c[tau-1],b=c[tau],e=c[tau+1]??b,den=a+e-2*b;
  return sr/(den?tau+(a-e)/(2*den):tau);
}
const hz2midi=f=>69+12*Math.log2(f/440);
const SOL=["ド","レ♭","レ","ミ♭","ミ","ファ","ソ♭","ソ","ラ♭","ラ","シ♭","シ"];
const solName=m=>SOL[((Math.round(m)%12)+12)%12];
const LET={C:"ド",D:"レ",E:"ミ",F:"ファ",G:"ソ",A:"ラ",B:"シ"};
const noteSol=n=>n.sp?LET[n.sp[0]]+(n.sp[1]==="b"?"♭":n.sp[1]==="#"?"♯":""):solName(n.midi);

let ac=null;
function AC(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();return ac}
let scheduled=[];
function tone(midi,t0,dur,vol,type){
  const a=AC(),o=a.createOscillator(),g=a.createGain();
  o.type=type||"triangle";o.frequency.value=440*Math.pow(2,(midi-69)/12);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);
  g.gain.setValueAtTime(vol,Math.max(t0+0.03,t0+dur-0.06));g.gain.linearRampToValueAtTime(0,t0+dur);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+0.05);scheduled.push(o);
}
function scheduleGuide(t0,spb,b0,b1){
  if($("guide").value!=="1")return;
  for(const n of song.notes){if(n.start<b0||n.start>=b1)continue;
    tone(n.midi,t0+(n.start-b0)*spb,Math.max(0.08,Math.min(n.dur,b1-n.start)*spb*0.95),0.2)}
}
function clicks(t0,spb){for(let i=0;i<4;i++)tone(i?81:88,t0+i*spb,0.06,0.3,"square")}

let run=null,trail=[],frames=0,hits=0;
function spb(){return 60/BPM}
const MODES={easy:{tol:200,name:"やさしい"},normal:{tol:100,name:"ふつう"},hard:{tol:50,name:"むずかしい"}};
function tol(){return MODES[mode].tol}
function nBars(){return Math.max(1,song.bars.length)}
function barOf(beat){let i=0;while(i+1<song.bars.length&&song.bars[i+1]<=beat+1e-6)i++;return i}
function barEnd(i){return i+1<song.bars.length?song.bars[i+1]:song.total}
function rng(){let a=+$("barFrom").value||1,b=+$("barTo").value||nBars();if(b<a)[a,b]=[b,a];return{a,b,b0:song.bars[a-1]||0,b1:barEnd(b-1)}}
function fillBars(){
  const n=nBars();let f=+(store.get("kite-from")||1),t=+(store.get("kite-to")||n);
  f=Math.min(Math.max(1,f),n);t=Math.min(Math.max(1,t),n);
  for(const [id,v] of [["barFrom",f],["barTo",t]]){const el=$(id);el.innerHTML="";
    for(let i=1;i<=n;i++){const o=document.createElement("option");o.value=i;o.textContent=i+"小節";el.appendChild(o)}el.value=v}
}
function resetScore(){frames=0;hits=0;trail=[];for(const n of song.notes){n.frames=0;n.hit=0}}
function noteAt(beat){for(const n of song.notes)if(beat>=n.start&&beat<n.start+n.dur)return n;return null}
function judge(beat,midi){
  if(run&&(beat<run.b0||beat>=run.b1))return;
  const n=noteAt(beat);let shown=midi,ok=false;
  if(midi!=null&&n&&$("oct").value==="1")shown=midi-12*Math.round((midi-n.midi)/12);
  if(n){n.frames++;frames++;if(shown!=null&&Math.abs(shown-n.midi)*100<=tol()){ok=true;n.hit++;hits++}}
  trail.push({beat,midi:shown,ok});if(trail.length>4000)trail.shift();
}

async function startMic(){
  stopAll();
  const a=AC(); // create inside the tap so iOS allows sound
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){msg("マイクが使えませんでした（"+e.name+"）。Safariの設定でマイクを許可するか、下の「録音ファイルで採点する」を使ってください。",true);return}
  await a.resume();
  const src=a.createMediaStreamSource(stream),an=a.createAnalyser();an.fftSize=2048;src.connect(an);
  const s=spb(),start0=a.currentTime+0.3+4*s,r=rng();
  clicks(start0-4*s,s);scheduleGuide(start0,s,r.b0,r.b1);resetScore();
  run={kind:"mic",start0,spb:s,...r,analyser:an,stream,buf:new Float32Array(2048),last:0};
  msg("カウントのあとに歌ってください。");uiRunning(true);
}
function startGuideOnly(){
  stopAll();const a=AC(),s=spb(),start0=a.currentTime+0.3+4*s,r=rng();
  clicks(start0-4*s,s);scheduleGuide(start0,s,r.b0,r.b1);resetScore();
  run={kind:"guide",start0,spb:s,...r};msg("お手本を再生中です。");uiRunning(true);
}


function stopAll(finished){
  if(!run)return;
  for(const o of scheduled){try{o.stop()}catch(e){}}scheduled=[];
  if(run.stream)run.stream.getTracks().forEach(t=>t.stop());
  if(run.src){try{run.src.stop()}catch(e){}}
  const kind=run.kind;run=null;uiRunning(false);$("lvl").style.width="0";
  if(kind!=="guide")showScore(finished);
}
function uiRunning(on){$("btnStop").disabled=!on;$("btnMic").disabled=on;$("btnGuide").disabled=on}
function showScore(finished){
  if(!frames){$("scoreNum").textContent="--";$("scoreLbl").textContent="判定できる声がありませんでした";
    msg(song.notes.some(n=>n.start>=rng().b0&&n.start<rng().b1)?"声が拾えていません。マイク感度を右に上げてみてください。":"選んだ範囲はこのパートが休みの小節だけです。範囲を変えてください。",true);return}
  const p=Math.round(hits/frames*100);
  $("scoreNum").textContent=p+"%";
  const r=rng();
  addRecord({at:new Date().toISOString(),part,from:r.a,to:r.b,mode,score:p,finished:!!finished});
  $("scoreLbl").textContent=`${r.a}〜${r.b}小節・`+MODES[mode].name+"判定・"+(finished?"最後まで":"途中まで");
  const weak=[];song.notes.forEach((n,i)=>{if(n.frames>3&&n.hit/n.frames<0.4)weak.push(n.lyric||`${barOf(n.start)+1}小節目`)});
  msg(p>=80?"音程はよく合っています。":weak.length?`合いにくかったところ：${[...new Set(weak)].slice(0,8).join("・")}`:"もう一度、お手本を聴いてから歌ってみましょう。");
}
// ---- 記録（この端末のブラウザだけに保存） ----
const PART_NAME={S:"ソプラノ",A:"アルト",M:"男声"};
function loadRecs(){try{const a=JSON.parse(store.get("kite-records")||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveRecs(a){store.set("kite-records",JSON.stringify(a.slice(-500)))}
function addRecord(rec){const a=loadRecs();a.push(rec);saveRecs(a);renderRecs()}
function fmtDate(iso){const d=new Date(iso);return isNaN(d)?"":`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`}
function renderRecs(){
  const a=loadRecs(),box=$("recList");box.innerHTML="";
  $("recCount").textContent=a.length?`${a.length}件`:"";
  if(!a.length){box.innerHTML='<li class="msg">まだ記録がありません。「マイクで歌う」で歌い終わると、ここに残ります。</li>';return}
  const best={};for(const x of a){const k=`${x.part}|${x.from}|${x.to}|${x.mode}`;if(!best[k]||x.score>best[k])best[k]=x.score}
  for(const x of a.slice().reverse().slice(0,30)){
    const li=document.createElement("li");const k=`${x.part}|${x.from}|${x.to}|${x.mode}`;
    li.innerHTML=`<span class="rd"></span><span class="rp"></span><b class="rs"></b>`;
    li.querySelector(".rd").textContent=fmtDate(x.at);
    li.querySelector(".rp").textContent=`${PART_NAME[x.part]||"?"} ${x.from}〜${x.to}小節・${(MODES[x.mode]||{}).name||x.mode}${x.finished?"":"（途中）"}`;
    li.querySelector(".rs").textContent=x.score+"%"+(best[k]===x.score?" ★":"");
    box.appendChild(li)}
}
$("btnExport").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({app:"kite-karaoke",version:1,exportedAt:new Date().toISOString(),records:loadRecs()},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`kite-records-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  $("recMsg").textContent="記録をJSONファイルとして書き出しました。";
});
$("recFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const inc=(Array.isArray(j)?j:j.records||[]).filter(x=>x&&typeof x.score==="number"&&x.at);
    const cur=loadRecs(),seen=new Set(cur.map(x=>x.at+x.part+x.from+x.to+x.mode));
    const add=inc.filter(x=>!seen.has(x.at+x.part+x.from+x.to+x.mode));
    saveRecs(cur.concat(add).sort((p,q)=>p.at<q.at?-1:1));renderRecs();
    $("recMsg").textContent=`${add.length}件を読み込みました（重複は除きました）。`}
  catch(err){$("recMsg").textContent="このファイルは読み込めませんでした。書き出したJSONファイルを選んでください。"}
  e.target.value="";
});
$("btnClear").addEventListener("click",()=>{$("clearConfirm").hidden=false});
$("btnClearNo").addEventListener("click",()=>{$("clearConfirm").hidden=true});
$("btnClearYes").addEventListener("click",()=>{saveRecs([]);$("clearConfirm").hidden=true;renderRecs();$("recMsg").textContent="記録を消しました。"});
function msg(t,warn){const m=$("msg");m.textContent=t;m.classList.toggle("warn",!!warn)}

// ---- render ----
let W=0,H=260,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;cv.width=W*dpr;cv.height=H*dpr}
window.addEventListener("resize",resize);
function range(){
  if(!song.notes.length)return[57,72];
  let lo=Infinity,hi=-Infinity;for(const n of song.notes){lo=Math.min(lo,n.midi);hi=Math.max(hi,n.midi)}
  return[lo-4,hi+4];
}
function frame(){
  const a=ac;let t=-1;
  if(run&&a){
    t=a.currentTime-run.start0;const beat=run.b0+t/run.spb;
    if(run.kind==="mic"&&a.currentTime-run.last>0.03){
      run.last=a.currentTime;run.analyser.getFloatTimeDomainData(run.buf);
      const half=down2(run.buf);$("lvl").style.width=(meterScale(rmsOf(half))*100)+"%";
      if(t>=0){const f0=yin(half,a.sampleRate/2,gate());judge(beat,f0?hz2midi(f0):null)}
    }
    if(beat>run.b1+0.5)stopAll(true);
  }
  draw(run?run.b0+t/run.spb:(trail.length?trail[trail.length-1].beat:rng().b0-0.5));
  requestAnimationFrame(frame);
}
function draw(beat){
  if(!W)resize();
  const c=ctx2;c.setTransform(dpr,0,0,dpr,0,0);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,css("--sky-top"));g.addColorStop(1,css("--sky-bot"));
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const [lo,hi]=range(),pad=14,y=m=>pad+(hi-m)/(hi-lo)*(H-2*pad),lane=(H-2*pad)/(hi-lo);
  const ppb=Math.max(48,Math.min(80,W/9)),px=W*0.22,x=b=>px+(b-beat)*ppb;
  c.strokeStyle=css("--grid");c.lineWidth=1;
  for(const b of song.bars){const xx=x(b);if(xx<-2||xx>W+2)continue;c.beginPath();c.moveTo(xx+.5,0);c.lineTo(xx+.5,H);c.stroke()}
  {const r=run||rng(),xa=x(r.b0),xb=x(r.b1);c.fillStyle=css("--bg");c.globalAlpha=.55;
    if(xa>0)c.fillRect(0,0,xa,H);if(xb<W)c.fillRect(xb,0,W-xb,H);c.globalAlpha=1}
  const noteCol=css("--note"),hitCol=css("--note-hit"),ink=css("--fg"),solCol=css("--muted");
  c.font=`700 13px ${css("--body")}`;c.textBaseline="bottom";
  for(const n of song.notes){
    const x0=x(n.start),x1=x(n.start+n.dur);if(x1<-10||x0>W+10)continue;
    const yy=y(n.midi)-lane*0.35,h=Math.max(8,lane*0.7);
    c.fillStyle=noteCol;c.globalAlpha=0.35;rr(c,x0+1,yy,x1-x0-2,h,h/2);c.fill();c.globalAlpha=1;
    if(n.frames){const r=n.hit/n.frames;c.fillStyle=hitCol;c.globalAlpha=0.35+0.65*r;rr(c,x0+1,yy,x1-x0-2,h,h/2);c.fill();c.globalAlpha=1}
    c.fillStyle=ink;if(n.lyric&&n.lyric!=="ー")c.fillText(n.lyric,x0+2,yy-2);
    const k=song.notes.indexOf(n),off=n.dur<0.5&&k%2?12:0;
    c.fillStyle=solCol;c.font=`700 11px ${css("--body")}`;c.textBaseline="top";
    c.fillText(noteSol(n),x0+2,yy+h+2+off);
    c.font=`700 13px ${css("--body")}`;c.textBaseline="bottom";
  }
  // current target note badge
  const cur=noteAt(beat);
  if(cur){c.fillStyle=css("--surface");c.globalAlpha=.85;rr(c,8,8,104,34,8);c.fill();c.globalAlpha=1;
    c.fillStyle=ink;c.font=`11px ${css("--body")}`;c.textBaseline="top";c.fillText("いまの音",16,11);
    c.font=`700 15px ${css("--body")}`;c.fillText(solLong(cur),16,23);c.textBaseline="bottom"}
  const vc=css("--voice"),vok=css("--voice-ok");
  for(const p of trail){if(p.midi==null)continue;const xx=x(p.beat);if(xx<-4||xx>W)continue;
    const yy=y(Math.max(lo-1,Math.min(hi+1,p.midi)));c.fillStyle=p.ok?vok:vc;c.globalAlpha=p.ok?1:.55;c.beginPath();c.arc(xx,yy,p.ok?3.4:2.6,0,7);c.fill()}
  c.globalAlpha=1;
  c.strokeStyle=css("--playhead");c.lineWidth=2;c.beginPath();c.moveTo(px,0);c.lineTo(px,H);c.stroke();
  const last=trail.length?trail[trail.length-1]:null;
  if(run&&last&&last.midi!=null&&beat-last.beat<0.3)kite(c,px,y(Math.max(lo,Math.min(hi,last.midi))),last.ok);
  if(run&&beat<run.b0){c.fillStyle=ink;c.font=`48px ${css("--display")}`;c.textAlign="center";c.textBaseline="middle";c.fillText(String(Math.ceil(run.b0-beat)),W/2,H/2);c.textAlign="left"}
  lyricLine(beat);
}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function kite(c,x,y,ok){c.save();c.translate(x,y);c.fillStyle=ok?css("--accent"):css("--muted");c.beginPath();c.moveTo(0,-11);c.lineTo(8,0);c.lineTo(0,11);c.lineTo(-8,0);c.closePath();c.fill();
  c.strokeStyle=css("--tail");c.lineWidth=2;c.beginPath();c.moveTo(0,11);c.quadraticCurveTo(-8,20,-16,16);c.stroke();c.restore()}
let lastLy=null;
function lyricLine(beat){
  const bi=barOf(Math.max(0,beat)),bs=bi-bi%2,bar=song.bars[bs]||0,barE=barEnd(Math.min(bs+1,song.bars.length-1));
  const ns=song.notes.filter(n=>n.start>=bar&&n.start<barE);
  let html=ns.map(n=>{const cls=beat>=n.start+n.dur?"done":beat>=n.start?"now":"";
    return n.lyric?`<ruby class="${cls}">${esc(n.lyric)}<rt>${noteSol(n)}</rt></ruby>`:`<span class="sol ${cls}">${noteSol(n)}</span>`}).join("");
  if(!ns.length)html=song.notes.length&&beat>=song.total?"":"<small>この区間は休みです</small>";
  if(html!==lastLy){$("lyric").innerHTML=html;lastLy=html}
}
function esc(s){return s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}

// ---- controls ----
function seg(id,cb){const el=$(id);el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));cb(b.dataset.v)})}
function reload(){stopAll();song=build(part);fillBars();resetScore();lastLy=null}
for(const id of ["barFrom","barTo"])$(id).addEventListener("change",()=>{stopAll();
  store.set("kite-from",$("barFrom").value);store.set("kite-to",$("barTo").value);
  trail=[];lastLy=null;$("scoreNum").textContent="--";$("scoreLbl").textContent="まだ歌っていません"});
seg("modeSeg",v=>{mode=v;store.set("kite-mode",v)});
document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===mode?"true":"false"));
document.querySelectorAll("#partSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===part?"true":"false"));
seg("partSeg",v=>{part=v;store.set("kite-voice",v);reload();$("scoreNum").textContent="--";$("scoreLbl").textContent="まだ歌っていません"});

$("btnMic").addEventListener("click",startMic);
$("btnGuide").addEventListener("click",startGuideOnly);
$("btnStop").addEventListener("click",()=>stopAll(false));
fillBars();renderRecs();resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
