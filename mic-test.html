<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<title>マイク動作テスト</title>
<style>
:root{--bg:#f3f6fa;--fg:#17202c;--muted:#5d6b7c;--line:#d6dee8;--accent:#d8432f;--ok:#1f8a5b;--ng:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--fg:#e8eef5;--muted:#95a3b5;--line:#2b3644;--accent:#ef6a52;--ok:#57c995;--ng:#ff8a80;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;
  padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.4rem;margin:0}
button{font:inherit;font-weight:700;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff}
button:disabled{opacity:.4}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
.big{font-size:3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>マイク動作テスト</h1>
  <p class="muted">「テスト開始」を押してマイクを許可し、「あー」と声を出してください。下の音名と数字が声に合わせて動けば成功です。</p>
  <div>
    <div class="row"><span>https で開いているか</span><span id="sec"></span></div>
    <div class="row"><span>マイクの許可</span><span id="perm">未確認</span></div>
  </div>
  <button id="go" type="button">テスト開始</button>
  <div class="meter"><i id="lvl"></i></div>
  <div class="big" id="note">--</div>
  <div class="muted" style="text-align:center" id="hz">声の高さ（Hz）</div>
</main>
<script>
const $=id=>document.getElementById(id);
$("sec").innerHTML=window.isSecureContext?'<span class="ok">はい</span>':'<span class="ng">いいえ</span>';
const NAMES=["ド","ド♯","レ","レ♯","ミ","ファ","ファ♯","ソ","ソ♯","ラ","ラ♯","シ"];
function yin(buf,sr){
  let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);
  if(rms<0.004)return{f:null,rms};
  const maxT=Math.min(Math.floor(sr/65),buf.length>>1),minT=Math.floor(sr/1100),W=buf.length-maxT;
  const c=new Float32Array(maxT+1);let run=0;c[0]=1;
  for(let t=1;t<=maxT;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x}run+=s;c[t]=run?s*t/run:1}
  for(let t=Math.max(2,minT);t<maxT;t++){if(c[t]<0.15){while(t+1<maxT&&c[t+1]<c[t])t++;
    const a=c[t-1],b=c[t],e=c[t+1],d=a+e-2*b;return{f:sr/(d?t+(a-e)/(2*d):t),rms}}}
  return{f:null,rms};
}
$("go").addEventListener("click",async()=>{
  $("go").disabled=true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $("perm").innerHTML='<span class="ng">このブラウザではマイクを使えません</span>';return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){$("perm").innerHTML='<span class="ng">使えません（'+e.name+'）</span>';$("go").disabled=false;return}
  $("perm").innerHTML='<span class="ok">OK</span>';
  const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
  const an=ac.createAnalyser();an.fftSize=2048;ac.createMediaStreamSource(stream).connect(an);
  const buf=new Float32Array(2048),half=new Float32Array(1024),sr=ac.sampleRate/2;
  (function loop(){
    an.getFloatTimeDomainData(buf);
    for(let i=0;i<1024;i++)half[i]=(buf[2*i]+buf[2*i+1])/2;
    const r=yin(half,sr);
    $("lvl").style.width=Math.min(100,r.rms*400)+"%";
    if(r.f){const m=69+12*Math.log2(r.f/440),n=Math.round(m),cents=Math.round((m-n)*100);
      $("note").textContent=NAMES[(n%12+12)%12]+(Math.floor(n/12)-1);
      $("hz").textContent=r.f.toFixed(1)+" Hz（"+(cents>=0?"+":"")+cents+" セント）"}
    requestAnimationFrame(loop);
  })();
});
</script>
</body>
</html>
