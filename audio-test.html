<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<title>音の動作テスト</title>
<style>
:root{--bg:#f3f6fa;--fg:#17202c;--muted:#5d6b7c;--line:#d6dee8;--accent:#2a62d6;--ok:#1f8a5b;--ng:#b3261e;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--fg:#e8eef5;--muted:#95a3b5;--line:#2b3644;--accent:#5b8cff;--ok:#57c995;--ng:#ff8a80;--surface:#18202b;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
  padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.4rem;margin:0}
button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.row:last-child{border-bottom:0}
.row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ok{color:var(--ok)}.ng{color:var(--ng)}
.muted{color:var(--muted);font-size:.9rem}
a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>音の動作テスト</h1>
  <p class="muted">カラオケで使うのと同じイヤホン・スピーカーにして「テスト開始」を押してください。約15秒、カチカチという拍とピアノの和音が鳴ります。終わったら、この画面の写真を送ってください。</p>
  <button id="go" type="button">テスト開始</button>
  <div class="card" id="out">
    <div class="row"><span>ブラウザ</span><span id="ua"></span></div>
    <div class="row"><span>音の形式（マイクなし）</span><span id="sr1">—</span></div>
    <div class="row"><span>演奏の速さ（マイクなし）</span><span id="sp1">—</span></div>
    <div class="row"><span>音の形式（マイクあり）</span><span id="sr2">—</span></div>
    <div class="row"><span>演奏の速さ（マイクあり）</span><span id="sp2">—</span></div>
    <div class="row"><span>画面の動き</span><span id="fps">—</span></div>
    <div class="row"><span>和音は聞こえたか</span><span id="heard">—</span></div>
  </div>
  <div id="ask" hidden class="card">
    <div>ピアノの和音（低い音と高い音）は聞こえましたか？</div>
    <div style="display:flex;gap:8px;margin-top:8px"><button type="button" data-h="はい">聞こえた</button><button type="button" data-h="小さい">小さい</button><button type="button" data-h="いいえ">聞こえない</button></div>
  </div>
  <p class="muted"><a href="index.html">← カラオケに戻る</a></p>
</main>
<script>
const $=id=>document.getElementById(id);
const ua=navigator.userAgent;$("ua").textContent=(/Edg\//.test(ua)?"Edge":/Chrome\//.test(ua)?"Chrome":/Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":"その他")+(/Windows/.test(ua)?"（Windows）":/iPhone|iPad/.test(ua)?"（iPhone/iPad）":/Mac/.test(ua)?"（Mac）":"");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function piano(a,midi,t0,dur,vol){const f=440*Math.pow(2,(midi-69)/12),g=a.createGain(),o=a.createOscillator();o.type="triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.006);g.gain.exponentialRampToValueAtTime(0.0005,t0+dur);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+0.02)}
function click(a,t,hi){const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=hi?1320:880;g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.06)}
async function measure(a,secs,withChords){
  const spb=60/89,t0=a.currentTime+0.2,n=Math.floor(secs/spb);
  for(let i=0;i<n;i++){click(a,t0+i*spb,i%4===0);if(withChords&&i%4===0){for(const m of [47,59,63,66])piano(a,m,t0+i*spb,spb*3.8,0.18)}}
  const p0=performance.now(),c0=a.currentTime;let frames=0,run=true;(function f(){frames++;if(run)requestAnimationFrame(f)})();
  await wait(secs*1000);run=false;
  const dp=(performance.now()-p0)/1000,dc=a.currentTime-c0;return {ratio:dc/dp,fps:frames/dp}}
function show(id,r){const pct=Math.round(r*100),el=$(id);el.textContent=pct+"%";el.className=(pct>=95&&pct<=105)?"ok":"ng"}
$("go").addEventListener("click",async()=>{
  $("go").disabled=true;
  const a=new (window.AudioContext||window.webkitAudioContext)();await a.resume();
  $("sr1").textContent=a.sampleRate+" Hz";
  const r1=await measure(a,7,true);show("sp1",r1.ratio);$("fps").textContent=Math.round(r1.fps)+" 回/秒";
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const src=a.createMediaStreamSource(st);
    $("sr2").textContent=a.sampleRate+" Hz";const r2=await measure(a,6,false);show("sp2",r2.ratio);st.getTracks().forEach(t=>t.stop())}
  catch(e){$("sr2").textContent="マイク使えず";$("sp2").textContent="—"}
  $("ask").hidden=false;$("go").disabled=false;
});
$("ask").addEventListener("click",e=>{const b=e.target.closest("button");if(b){$("heard").textContent=b.dataset.h;$("ask").hidden=true}});
</script>
</body>
</html>
